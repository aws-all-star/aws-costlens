[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-finops-tool"
version = "0.1.0"
description = "Read-only AWS FinOps CLI for cost, credit, and waste checks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Donghyun Kim" }
]
dependencies = [
  "boto3>=1.35.0",
  "rich>=13.7.0",
  "typer>=0.12.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0"
]

[project.scripts]
aws-finops = "aws_finops_tool.cli:app"

[tool.setuptools.packages.find]
include = ["aws_finops_tool*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
