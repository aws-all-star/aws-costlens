[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-costlens-tool"
version = "0.1.0"
description = "A lightweight, read-only AWS FinOps CLI for cost analysis, waste detection, credit monitoring, and optimization recommendations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.35.0",
    "rich>=13.7.0",
    "typer>=0.12.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0"
]

[project.scripts]
aws-costlens = "aws_costlens_tool.cli:app"

[tool.setuptools.packages.find]
include = ["aws_costlens*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
